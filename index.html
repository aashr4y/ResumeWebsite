<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aashray Doshi — Resume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="resume-container">

    <!-- HEADER & NAVIGATION -->
    <header class="header">
      <div class="profile-pic-wrapper">
        <img
          src="images/photo.png"
          alt="Aashray Doshi"
          width="130"
          height="130"
          class="profile-pic"
          onerror="this.onerror=null; this.src='photo.png';"
        >
      </div>
      <div class="header-info">
        <h1 id="r-name">Aashray Doshi</h1>
        <p id="r-tagline" class="subtitle"></p>

        <nav class="nav-links">
          <a href="#about">Summary</a>
          <a href="#education">Education</a>
          <a href="#experience">Experience</a>
          <a href="#hobbies">Extracurriculars</a>
          <a href="#skills">Skills</a>
          <a href="#contact">Contact</a>
        </nav>
      </div>
    </header>

    <!-- SUMMARY -->
    <section id="about" class="section">
      <h2 class="section-title">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        Summary
      </h2>
      <p id="r-summary" class="summary-text"></p>
    </section>

    <!-- EDUCATION -->
    <section id="education" class="section">
      <h2 class="section-title">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/><path d="M22 10v6"/></svg>
        </span>
        Education &amp; Achievements
      </h2>
      <div id="r-education"></div>
    </section>

    <!-- EXPERIENCE -->
    <section id="experience" class="section">
      <h2 class="section-title">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        </span>
        Experience
      </h2>
      <div id="r-experience"></div>
    </section>

    <!-- EXTRACURRICULARS -->
    <section id="hobbies" class="section">
      <h2 class="section-title">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>
        </span>
        Extracurriculars &amp; Interests
      </h2>
      <div id="r-extracurriculars"></div>
    </section>

    <!-- SKILLS -->
    <section id="skills" class="section">
      <h2 class="section-title">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        </span>
        Skills
      </h2>
      <div id="r-skills"></div>
    </section>

    <!-- FOOTER / CONTACT -->
    <footer id="contact" class="footer">
      <h3>LET'S CONNECT</h3>
      <div id="r-contact" class="contact-details"></div>
      <p class="copyright">© 2026 Aashray Doshi. All rights reserved.</p>
    </footer>

  </main>

  <script src="content.js"></script>
  <script>
    if (typeof resume !== 'undefined') {

      // Small inline icons (use the current text colour)
      const svg = (inner) =>
        `<svg class="c-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;

      const icons = {
        mail: svg('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>'),
        phone: svg('<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>'),
        instagram: svg('<rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"/>'),
        // Filled LinkedIn logo (rounded square with "in")
        linkedin: `<svg class="c-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 1 1 0-4.125 2.062 2.062 0 0 1 0 4.125zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>`
      };

      document.getElementById('r-name').textContent = resume.name;
      document.getElementById('r-tagline').textContent = resume.tagline;
      document.getElementById('r-summary').textContent = resume.summary;

      // Render Education
      document.getElementById('r-education').innerHTML = resume.education.map(ed => `
        <div class="card">
          <div class="card-header">
            <h3>${ed.title}</h3>
            <span class="meta">${ed.org}${ed.details && typeof ed.details === 'string' ? ' | ' + ed.details : ''}</span>
          </div>
          ${Array.isArray(ed.details) && ed.details.length ? `
            <ul>
              ${ed.details.map(d => `<li>${d}</li>`).join('')}
            </ul>
          ` : ''}
        </div>
      `).join('');

      // Render Experience (jobs + ventures combined)
      document.getElementById('r-experience').innerHTML = resume.experience.map(item => `
        <div class="card">
          <div class="card-header">
            <h3>${item.title}</h3>
            <span class="meta">${item.org}${item.dates ? ' | ' + item.dates : ''}</span>
          </div>
          ${item.points && item.points.length ? `
            <ul>
              ${item.points.map(pt => `<li>${pt}</li>`).join('')}
            </ul>
          ` : ''}
        </div>
      `).join('');

      // Render Extracurriculars
      document.getElementById('r-extracurriculars').innerHTML = resume.extracurriculars.map(ex => `
        <div class="card">
          <div class="card-header">
            <h3>${ex.title}</h3>
            <span class="meta">${ex.meta || ''}</span>
          </div>
          ${ex.text ? `<p class="card-text">${ex.text}</p>` : ''}
          ${ex.points && ex.points.length ? `
            <ul>
              ${ex.points.map(pt => `<li>${pt}</li>`).join('')}
            </ul>
          ` : ''}
        </div>
      `).join('');

      // Render Skills (grouped)
      document.getElementById('r-skills').innerHTML = resume.skills.map(group => `
        <div class="skill-group">
          <h3>${group.category}</h3>
          <div class="skills-grid">
            ${group.items.map(s => `<span class="skill-tag">${s}</span>`).join('')}
          </div>
        </div>
      `).join('');

      // Render Contact
      const c = resume.contact;
      document.getElementById('r-contact').innerHTML = `
        <p>${icons.mail}<a href="mailto:${c.emails[0]}">${c.emails[0]}</a></p>
        ${c.emails[1] ? `<p>${icons.mail}<a href="mailto:${c.emails[1]}">${c.emails[1]}</a></p>` : ''}
        <p>${icons.phone}<a href="tel:${c.phone}">${c.phoneDisplay}</a></p>
        <p>${icons.instagram}<a href="https://instagram.com/${c.instagram}" target="_blank" rel="noopener noreferrer">@${c.instagram}</a></p>
        <p>${icons.linkedin}<a href="${c.linkedin}" target="_blank" rel="noopener noreferrer">linkedin.com/in/aashray-doshi</a></p>
      `;
    }
  </script>
</body>
</html>
